# .github/workflows/ci.yml

name: CI_Reservation

on:
    push:
        branches: ["**"]
        tags: ["v*"]
    pull_request:

permissions:
    contents: read

jobs:
    verifier:
        runs-on: ubuntu-24.04
        defaults:
            run:
                working-directory: app

        steps:
            - name: Recuperer le code
              uses: actions/checkout@v7

            - name: Installer Node
              uses: actions/setup-node@v7
              with:
                  node-version: 24.22.3

            - name: Installer les dependances
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Tests
              run: npm test

            - name: Construire l'image
              run: docker build .

            - name: Publier les rapports
              if: always()
              uses: actions/upload-artifact@v6
              with:
                  name: rapport-de-tests
                  path: app/reports/junit.xml
    publier:
        needs: verifier
        if: github.event_name == 'push'
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            packages: write

        steps:
            - name: Recuperer le code
              uses: actions/checkout/@v7

            - name: Nom de l'image en minuscule
              id: nom
              run: |
                  image="ghcr.io/$GITHUB_REPOSITORY,,"
                  if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
                      version="${GITHUB_REF_NAME#v}"
                      tags="$image:$GITHUB_SHA,$image:$version"
                  else
                      version="dev-${GITHUB_SHA::7}"
                      tags="$image:$GITHUB_SHA"
                  fi
                  {
                      echo "image=$image"
                      echo "version=$version"
                      echo "tags=$tags"
                  } >> "$GITHUB_OUTPUT"

            - name: Connexion ghcr.io
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{github.actor}}
                  password: ${{secrets.GITHUB_TOKEN}}

            - name: Construire et publier l'image
              uses: docker/build-push-action@v7
              with:
                  context: app
                  push: true
                  tags: ${{ steps.nom.outputs.image }}:${{ github.sha }}
                  build-args: |
                      APP_COMMIT=${{github.sha}}
                      APP_VERSION=${{steps.nom.outputs.version}}
