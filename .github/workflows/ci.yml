# .github/workflows/ci.yml

name: CI_Reservation

on: 
 push: 
  branches: ['**']
 pull_request:

permissions:
 contents: read

jobs:
 verifier:
  runs-on: ubuntu-24.04
  defaults: 
   run: 
    working-directory: app

  steps:
   - name: Recuperer le code
     uses: actions/checkout@v7

   - name: Installer Node
     uses: actions/setup-node@v7
     with:
      node-version: 24.22.3

   - name: Installer les dependances
     run: npm ci

   - name: Lint
     run: npm run lint

   - name: Tests
     run: npm test

   - name: Construire l'image
     run: docker build

   - name: Publier les rapports
     if: always()
     uses: actions/upload-artifact@v6
     with:
      name: rapport-de-tests
      path: app/reports/junit.xml



